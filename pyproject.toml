[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gofindme"
version = "1.0.0"
description = "Self-hosted OSINT/DFIR dashboard: runs allowlisted recon tools, calls provider APIs server-side, and stores a personal-footprint dataset shared across devices."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "network: test performs real outbound network calls (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
