plugins {
    id 'com.android.application' version '8.2.2'
    id 'com.chaquo.python' version '15.0.1'
}

android {
    namespace 'com.gofindme.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gofindme.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version '3.11'
        def bp = System.getenv('CHAQUOPY_PYTHON')
        if (bp) {
            buildPython bp
        } else {
            buildPython 'python3', 'python'
        }
        pip {
            install 'fastapi'
            install 'pydantic<2'
            install 'uvicorn'
            install 'httpx'
            install 'passlib'
            install 'python-multipart'
            install 'cryptography==42.0.8'
        }
    }
}
