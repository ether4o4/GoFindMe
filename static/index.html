<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c10">
<title>GoFindMe · Investigations Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232dd4a7'/%3E%3Cg fill='none' stroke='%2304160f' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='5'/%3E%3Cpath d='m15 15 3 3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="neversoft-splash" aria-hidden="true">
  <div class="ns-inner">
    <div class="ns-badge">N</div>
    <div class="ns-word">NeverSoft Services</div>
    <div class="ns-bar"><span></span></div>
  </div>
</div>
<style>
#neversoft-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  background:linear-gradient(180deg,#121216,#0b0b0d);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  opacity:1;transition:opacity .45s ease}
#neversoft-splash.ns-hide{opacity:0}
#neversoft-splash .ns-inner{display:flex;flex-direction:column;align-items:center;gap:14px}
#neversoft-splash .ns-badge{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;
  font-weight:800;font-size:30px;color:#0b0b0d;
  background:linear-gradient(135deg,#5ed1a0,#4f86f7)}
#neversoft-splash .ns-word{font-size:18px;font-weight:740;letter-spacing:-.3px;color:#f2f2f5}
#neversoft-splash .ns-bar{width:132px;height:3px;border-radius:3px;background:#2a2a33;overflow:hidden}
#neversoft-splash .ns-bar span{display:block;height:100%;width:40%;border-radius:3px;
  background:linear-gradient(90deg,#5ed1a0,#4f86f7);animation:ns-slide 1s ease-in-out infinite}
@keyframes ns-slide{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
@media(prefers-reduced-motion:reduce){#neversoft-splash .ns-bar span{animation:none}}
</style>
<script>
(function(){
  var s=document.getElementById('neversoft-splash');
  if(!s)return;
  setTimeout(function(){
    s.classList.add('ns-hide');
    setTimeout(function(){if(s&&s.parentNode)s.parentNode.removeChild(s);},500);
  },850);
})();
</script>
<div id="app"></div>
<noscript>GoFindMe requires JavaScript.</noscript>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
