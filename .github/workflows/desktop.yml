name: Build Desktop App

on:
  push:
    branches: [claude/desktop-app, main]
    paths:
      - 'app/**'
      - 'static/**'
      - 'legacy/**'
      - 'desktop/**'
      - 'requirements.txt'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: GoFindMe-linux
          - os: windows-latest
            asset: GoFindMe-windows.exe
          - os: macos-latest
            asset: GoFindMe-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller desktop/GoFindMe.spec --noconfirm

      - name: Name the binary per-OS
        run: cp dist/GoFindMe* "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: ls -R dist
      # Permanent download: a rolling "desktop-latest" release with one asset per OS.
      - name: Publish to rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: GoFindMe Desktop (latest build)
          prerelease: true
          body: |
            Standalone GoFindMe desktop apps — no Python needed, just download and run.
            Built from commit ${{ github.sha }}.
            - Windows: GoFindMe-windows.exe
            - macOS:   GoFindMe-macos
            - Linux:   GoFindMe-linux
          files: dist/**/*
