name: Build Android APK

on:
  push:
    branches: [claude/android-apk, main]
    paths:
      - 'android/**'
      - 'app/**'
      - 'static/**'
      - 'legacy/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/**'
      - 'static/**'
      - 'legacy/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11 (Chaquopy buildPython)
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage Python sources into the Android project
        run: |
          mkdir -p android/app/src/main/python
          cp -r app static legacy android/app/src/main/python/
          echo "Staged:" && find android/app/src/main/python -maxdepth 2 -type f | sort | head -80

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        env:
          CHAQUOPY_PYTHON: ${{ steps.py.outputs.python-path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK integrity and manifest
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "package: name=|launchable-activity:"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofindme-android-2.0.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Stage APK with a friendly name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gofindme-debug.apk

      - name: Publish APK to rolling Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: GoFindMe Android (latest)
          prerelease: true
          body: |
            GoFindMe Android 2.0.0 debug build.
            Built from commit ${{ github.sha }} and passed APK integrity verification.
          files: gofindme-debug.apk
