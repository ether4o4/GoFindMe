name: Build Android APK

on:
  push:
    branches: [claude/android-apk]
    paths:
      - 'android/**'
      - 'app/**'
      - 'static/**'
      - 'legacy/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage Python sources into the Android project
        run: |
          mkdir -p android/app/src/main/python
          cp -r app static legacy android/app/src/main/python/
          echo "Staged:" && ls android/app/src/main/python

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofindme-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
